<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>갈래? 말래? 화면 시연</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 로비(종이 바탕 카드 2장) ↔ 게임 방(초록 담요 판 + 오른쪽 채팅). Swing 클라이언트와 같은 배치·색.
   한 가지 화면 세계(화투판)를 쓰는 의도적인 단일 테마. */
:root {
  --red: #c81e1e;
  --red-dark: #961414;
  --ink: #221e1c;
  --paper: #f6f1e7;
  --paper-dark: #e3d9c6;
  --white: #ffffff;
  --felt: #1f5c3a;
  --felt-dark: #15422a;
  --felt-line: #2e774e;
  --felt-text: #d4e6da;
  --felt-muted: #a9c9b4;
  --gold: #ffd600;
  --muted: #776e64;
  --good: #1e7a3c;
  --display: "Black Han Sans", "Noto Sans KR", "Malgun Gothic", sans-serif;
  --body: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Consolas, "D2Coding", monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 14px;
  line-height: 1.5;
}
button { font: inherit; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.btn {
  border: 1px solid var(--paper-dark);
  background: var(--white);
  color: var(--ink);
  font-weight: 700;
  padding: 7px 14px;
  border-radius: 4px;
  cursor: pointer;
  white-space: nowrap;
}
.btn:hover:not(:disabled) { border-color: var(--ink); }
.btn.primary { background: var(--red); border-color: var(--red-dark); color: var(--white); }
.btn.primary:hover:not(:disabled) { background: var(--red-dark); }
.btn.dark { background: transparent; border-color: #4a443f; color: var(--white); }
.btn:disabled { opacity: .45; cursor: default; }
input[type=text] {
  font: inherit;
  padding: 7px 10px;
  border: 1px solid var(--paper-dark);
  border-radius: 4px;
  background: var(--white);
  color: var(--ink);
  min-width: 0;
}
input[readonly] { background: var(--paper); color: var(--muted); }

/* 시연판 안내 띠 */
.demo-band {
  background: var(--gold);
  color: var(--ink);
  font-size: 12px;
  font-weight: 700;
  padding-block: 5px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.band-actions { display: flex; gap: 16px; }
.demo-band button { background: none; border: 0; padding: 0; font-weight: 700; text-decoration: underline; cursor: pointer; color: inherit; }

.screen { display: flex; flex-direction: column; min-height: calc(100% - 28px); }

/* ---------------- 로비 ---------------- */
.lobby-head {
  background: var(--ink);
  color: var(--white);
  padding-block: 18px 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.logo { font-family: var(--display); font-size: 34px; line-height: 1.1; letter-spacing: .5px; }
.logo .q { color: var(--red); }
.lobby-head .sub { color: #c9c1b4; font-size: 13px; margin-top: 2px; }
.lobby-head .band { height: 8px; background: var(--red); margin-top: 16px; }
.lobby-body {
  flex: 1;
  display: grid;
  gap: 16px;
  align-content: start;
  padding-block: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 1100px;
  width: 100%;
  margin: 0 auto;
}
.panel {
  background: var(--white);
  border: 1px solid var(--paper-dark);
  padding: 16px;
  min-width: 0;
}
.panel h2 { font-size: 16px; margin: 0 0 10px; }
.connect-row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.field { display: flex; gap: 8px; align-items: center; }
.field label { color: var(--muted); font-size: 13px; white-space: nowrap; }
.hint { color: var(--muted); font-size: 12px; margin: 8px 0 0; }
.welcome { font-weight: 700; margin: 6px 0 0; min-height: 1.5em; }
.rooms-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.rooms-head h2 { margin: 0; }
.rooms-head .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.create-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; background: var(--paper); padding: 10px; margin-bottom: 10px; border: 1px dashed var(--paper-dark); }
.create-form input { flex: 1 1 200px; }
.table-wrap { overflow-x: auto; border: 1px solid var(--paper-dark); }
table.rooms { width: 100%; border-collapse: collapse; min-width: 420px; }
table.rooms th { background: var(--paper); font-size: 13px; text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--paper-dark); }
table.rooms th.c, table.rooms td.c { text-align: center; }
table.rooms td { padding: 9px 12px; border-bottom: 1px solid var(--paper); font-variant-numeric: tabular-nums; }
table.rooms tbody tr { cursor: pointer; }
table.rooms tbody tr:hover td { background: #fbf6ee; }
table.rooms tbody tr.sel td { background: #fbe3e3; }
table.rooms tbody tr.off { color: var(--muted); cursor: default; }
.st { font-weight: 700; font-size: 13px; }
.st.wait { color: var(--good); }
.st.play { color: var(--muted); }
.empty { color: var(--muted); text-align: center; padding: 18px; }
.statusbar {
  background: var(--paper-dark);
  font-size: 12px;
  color: var(--muted);
  padding-block: 6px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.statusbar.err { color: var(--red); font-weight: 700; }

/* ---------------- 게임 방 ---------------- */
.room-head {
  background: var(--ink);
  color: var(--white);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.room-head .t { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
.room-head h1 { font-size: 18px; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill { color: var(--gold); font-size: 12px; font-weight: 700; white-space: nowrap; }
.room-body { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 300px; min-height: 0; }
.board {
  background: linear-gradient(var(--felt), var(--felt-dark));
  color: var(--white);
  padding: 14px 18px;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

/* 대기 */
.wait-view { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding-block: 20px; }
.wait-view h2 { font-size: 24px; margin: 0; }
.wait-view .hint2 { color: var(--felt-text); margin: 0; }
.seats { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; margin-block: 14px; }
.seat {
  width: 220px; max-width: 100%;
  height: 150px;
  background: var(--paper);
  color: var(--ink);
  border-bottom: 4px solid var(--paper-dark);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
}
.seat.ready { border-bottom-color: var(--red); }
.seat .n { font-size: 20px; font-weight: 700; }
.seat .s { font-size: 14px; font-weight: 700; color: var(--muted); }
.seat.ready .s { color: var(--red); }
.seat.empty { background: transparent; border: 2px dashed var(--felt-muted); color: var(--felt-muted); }
.seat.empty .s { color: var(--felt-muted); }
.ready-btn { font-size: 18px; padding: 12px 0; width: 220px; max-width: 100%; }

/* 게임 */
.game-view { flex: 1; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
.parea { display: grid; gap: 4px; }
.pline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pline .name { font-weight: 700; font-size: 15px; }
.pline .info { color: var(--felt-text); font-size: 13px; font-variant-numeric: tabular-nums; }
.turn-badge { background: var(--gold); color: var(--ink); font-size: 12px; font-weight: 700; padding: 0 6px; }
.prow { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; }
.backs, .stack { display: flex; }
.backs img { width: 40px; }
.backs img + img { margin-left: -18px; }
.groups { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end; }
.group .gl { color: var(--felt-muted); font-size: 12px; font-weight: 700; display: block; }
.stack { min-height: 55px; min-width: 34px; }
.stack img { width: 34px; }
.stack img + img { margin-left: -23px; }
.tablearea {
  flex: 1;
  border: 2px solid var(--felt-line);
  border-radius: 6px;
  display: flex;
  gap: 18px;
  align-items: center;
  padding: 10px 14px;
  min-height: 150px;
}
.deck { display: grid; justify-items: center; gap: 4px; flex: 0 0 auto; }
.deck .pile { display: flex; }
.deck .pile img { width: 52px; }
.deck .pile img + img { margin-left: -48px; }
.deck .cnt { font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums; }
.tablecards { flex: 1; min-width: 0; }
.tablecards .gl { color: var(--felt-muted); font-size: 12px; font-weight: 700; display: block; margin-bottom: 4px; }
.cards { display: flex; gap: 8px; flex-wrap: wrap; }
.cardbtn {
  border: 0; padding: 0; background: none;
  width: 66px;
  position: relative;
  border-radius: 6px;
  transition: transform .12s ease;
  filter: drop-shadow(0 3px 2px rgba(0,0,0,.35));
}
.cardbtn img { display: block; width: 100%; border-radius: 6px; }
.cardbtn:disabled { cursor: default; }
.cardbtn.play { cursor: pointer; }
.cardbtn.play:hover, .cardbtn.play:focus-visible { transform: translateY(-10px); }
.cardbtn.cand { outline: 3px solid var(--gold); outline-offset: -1px; cursor: pointer; }
.cardbtn.cand:hover { transform: translateY(-6px); }
.cardbtn.dim::after { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.45); border-radius: 6px; }
.turnbar { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; min-height: 42px; }
.turnlabel { font-weight: 700; font-size: 16px; }
.turnlabel.mine { color: var(--gold); }
.gs { font-size: 16px; padding: 8px 0; width: 110px; }
.hand { display: flex; justify-content: center; gap: 6px; padding-top: 10px; }
.hand .cardbtn { width: 76px; flex: 0 1 76px; min-width: 0; }

/* 채팅 */
.chat {
  background: var(--paper);
  border-left: 1px solid var(--paper-dark);
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 0;
}
.chat h2 { font-size: 15px; margin: 0; }
.chatlog {
  flex: 1;
  min-height: 160px;
  background: var(--white);
  border: 1px solid var(--paper-dark);
  padding: 6px 8px;
  overflow-y: auto;
  font-size: 13px;
  word-break: break-word;
}
.chatlog .sys { color: var(--muted); font-style: italic; }
.chatlog .nm { font-weight: 700; margin-right: 6px; }
.chatlog .me .nm { color: var(--red); }
.qlabel { color: var(--muted); font-size: 12px; font-weight: 700; }
.quick { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.quick .btn { font-size: 12px; padding: 6px 4px; }
.chatin { display: flex; gap: 6px; }
.chatin input { flex: 1; }

/* 모달 */
.modal-bg { position: fixed; inset: 0; background: rgba(20,18,16,.55); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 30; }
.modal { background: var(--white); color: var(--ink); width: 360px; max-width: 100%; padding: 20px; border-top: 6px solid var(--red); }
.modal h3 { margin: 0 0 10px; font-size: 18px; }
.modal .body { white-space: pre-line; margin: 0 0 16px; }
.modal .row { display: flex; gap: 8px; justify-content: flex-end; }

/* 통신 로그 */
.logpanel {
  position: fixed;
  right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: 520px; max-width: calc(100% - 32px);
  height: 46vh;
  background: var(--ink);
  color: #e9e3d8;
  z-index: 20;
  display: flex; flex-direction: column;
  box-shadow: 0 6px 24px rgba(0,0,0,.35);
}
.logpanel .lh { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-bottom: 1px solid #3a3430; gap: 8px; }
.logpanel .lh b { font-size: 13px; }
.logpanel .lh small { color: #a99f92; }
.logbody { flex: 1; overflow: auto; padding: 8px 12px; font-family: var(--mono); font-size: 11.5px; line-height: 1.55; }
.logbody div { white-space: pre-wrap; word-break: break-all; margin-bottom: 4px; }
.logbody .out { color: #ffb4a8; }
.logbody .in { color: #b9e4c6; }
.logbody .tag { font-weight: 700; margin-right: 6px; }

@media (max-width: 900px) {
  .room-body { grid-template-columns: minmax(0, 1fr); }
  .chat { border-left: 0; border-top: 1px solid var(--paper-dark); }
  .chatlog { min-height: 140px; max-height: 220px; }
}
@media (max-width: 560px) {
  .logo { font-size: 28px; }
  .board { padding: 12px; }
  .cardbtn { width: 48px; }
  .hand .cardbtn { flex-basis: 60px; }
  .tablearea { gap: 10px; padding: 8px; }
  .deck .pile img { width: 40px; }
  .deck .pile img + img { margin-left: -37px; }
}
@media (prefers-reduced-motion: reduce) {
  .cardbtn { transition: none; }
}
</style>

</head>
<body>
<div class="demo-band" role="note">
  <span>UI 시연판 · 실제 서버와 연결되지 않습니다. 상대는 브라우저 안의 연습 봇이 둡니다.</span>
  <span class="band-actions"><button type="button" id="logToggle">통신 로그 보기</button><button type="button" id="resetBtn">처음부터 다시</button></span>
</div>

<!-- ======================= 로비 ======================= -->
<section class="screen" id="lobby">
  <header class="lobby-head">
    <div class="logo">갈래<span class="q">?</span> 말래<span class="q">?</span></div>
    <div class="sub">2인 맞고 · 로비</div>
    <div class="band"></div>
  </header>

  <div class="lobby-body">
    <section class="panel" aria-labelledby="connTitle">
      <h2 id="connTitle">서버 접속</h2>
      <form class="connect-row" id="connectForm">
        <div class="field"><label for="host">서버 주소</label><input type="text" id="host" value="시연용 가상 서버" readonly size="14"></div>
        <div class="field"><label for="port">포트</label><input type="text" id="port" value="5000" readonly size="5"></div>
        <div class="field"><label for="nick">닉네임</label><input type="text" id="nick" maxlength="20" size="12" placeholder="예: 우진" autocomplete="off"></div>
        <button class="btn primary" type="submit" id="connectBtn">접속</button>
      </form>
      <p class="hint">닉네임은 1~12자, 줄바꿈 없이 입력합니다.</p>
      <p class="welcome" id="welcome"></p>
    </section>

    <section class="panel" aria-labelledby="roomsTitle">
      <div class="rooms-head">
        <h2 id="roomsTitle">방 목록</h2>
        <div class="actions">
          <button class="btn" type="button" id="refreshBtn" disabled>새로고침</button>
          <button class="btn" type="button" id="createBtn" disabled>방 만들기</button>
          <button class="btn primary" type="button" id="joinBtn" disabled>입장</button>
        </div>
      </div>
      <form class="create-form" id="createForm" hidden>
        <label for="roomTitle" class="qlabel">방 제목 (1~30자)</label>
        <input type="text" id="roomTitle" maxlength="40" autocomplete="off">
        <button class="btn primary" type="submit">만들기</button>
        <button class="btn" type="button" id="createCancel">취소</button>
      </form>
      <div class="table-wrap">
        <table class="rooms">
          <thead><tr><th>방 제목</th><th class="c">인원</th><th class="c">상태</th></tr></thead>
          <tbody id="roomRows"></tbody>
        </table>
        <div class="empty" id="roomEmpty">접속하면 방 목록이 보입니다.</div>
      </div>
    </section>
  </div>
  <div class="statusbar" id="lobbyStatus">닉네임을 입력하고 접속하세요.</div>
</section>

<!-- ======================= 게임 방 ======================= -->
<section class="screen" id="room" hidden>
  <header class="room-head">
    <div class="t"><h1 id="roomTitleText">게임 방</h1><span class="pill" id="roomPill">대기 중</span></div>
    <button class="btn dark" type="button" id="leaveBtn">나가기</button>
  </header>
  <div class="room-body">
    <main class="board">
      <div class="wait-view" id="waitView">
        <h2>상대를 기다리고 있습니다</h2>
        <p class="hint2" id="waitHint"></p>
        <div class="seats" id="seats"></div>
        <button class="btn primary ready-btn" type="button" id="readyBtn">준비</button>
      </div>

      <div class="game-view" id="gameView" hidden>
        <div class="parea" id="oppArea">
          <div class="pline"><span class="name" data-k="name"></span><span class="turn-badge" data-k="badge">차례</span><span class="info" data-k="info"></span></div>
          <div class="prow"><div class="backs" data-k="backs"></div><div class="groups" data-k="groups"></div></div>
        </div>
        <div class="tablearea">
          <div class="deck"><div class="pile" id="deckPile"></div><div class="cnt" id="deckCnt">덱 0장</div></div>
          <div class="tablecards"><span class="gl">바닥패</span><div class="cards" id="tableCards"></div></div>
        </div>
        <div class="turnbar">
          <span class="turnlabel" id="turnLabel"></span>
          <button class="btn primary gs" type="button" id="goBtn" hidden>고</button>
          <button class="btn gs" type="button" id="stopBtn" hidden>스톱</button>
        </div>
        <div class="parea" id="myArea">
          <div class="pline"><span class="name" data-k="name"></span><span class="turn-badge" data-k="badge">차례</span><span class="info" data-k="info"></span></div>
          <div class="prow"><div class="groups" data-k="groups"></div></div>
        </div>
        <div class="hand" id="hand"></div>
      </div>
    </main>

    <aside class="chat" aria-labelledby="chatTitle">
      <h2 id="chatTitle">채팅</h2>
      <div class="chatlog" id="chatLog" aria-live="polite"></div>
      <span class="qlabel">빠른 채팅</span>
      <div class="quick" id="quick"></div>
      <form class="chatin" id="chatForm">
        <label for="chatInput" hidden>채팅 입력</label>
        <input type="text" id="chatInput" autocomplete="off" placeholder="메시지 입력">
        <button class="btn primary" type="submit">전송</button>
      </form>
    </aside>
  </div>
</section>

<div class="modal-bg" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h3 id="modalTitle"></h3>
    <p class="body" id="modalBody"></p>
    <div class="row" id="modalRow"></div>
  </div>
</div>

<section class="logpanel" id="logPanel" hidden aria-label="통신 로그">
  <div class="lh"><div><b>통신 로그</b> <small>docs/README.md 형식의 JSON</small></div><button class="btn" type="button" id="logClear">지우기</button></div>
  <div class="logbody" id="logBody"></div>
</section>

/* ===== 통신 로그 ===== */
function logMsg(dir, msg) {
  const body = $("logBody");
  const div = document.createElement("div");
  div.className = dir === "송신" ? "out" : "in";
  const tag = document.createElement("span");
  tag.className = "tag";
  tag.textContent = "[" + dir + "]";
  div.appendChild(tag);
  div.appendChild(document.createTextNode(JSON.stringify(msg)));
  body.appendChild(div);
  while (body.children.length > 300) body.removeChild(body.firstChild);
  body.scrollTop = body.scrollHeight;
}

/* =====================================================================
   가상 서버: 실제 서버 대신 브라우저 안에서 프로토콜 메시지를 주고받는다.
   게임 규칙은 Swing 테스트 서버(MockServer)와 같은 간이 규칙.
   ===================================================================== */
const Server = (() => {
  const BOT = { playerId: "player-bot", nickname: "연습상대" };
  let me = null;                    // { playerId, nickname }
  let rooms = [];
  let roomSeq = 2, gameSeq = 0, choiceSeq = 0, timers = [];

  function initRooms() {
    rooms = [
      { roomId: "room-1", title: "초보만 오세요", players: [{ ...BOT, ready: true }], game: null, fake: false },
      { roomId: "room-2", title: "한 판 빨리 끝내요", players: [{ playerId: "p-x1", nickname: "지나가던고수", ready: true }, { playerId: "p-x2", nickname: "광박주의", ready: true }], game: {}, fake: true },
    ];
  }
  initRooms();

  const later = (fn, ms) => { const t = setTimeout(fn, ms); timers.push(t); };
  const toClient = (msg) => later(() => { logMsg("수신", msg); Client.onMessage(msg); }, 90);
  const ack = (rid, type, extra) => toClient({ type: "ACK", requestId: rid, payload: Object.assign({ requestType: type }, extra || {}) });
  const error = (rid, code, message) => toClient({ type: "ERROR", requestId: rid, payload: { code, message } });
  const myRoom = () => rooms.find(r => r.players.some(p => me && p.playerId === me.playerId));

  function roomList() {
    return { type: "ROOM_LIST", payload: { rooms: rooms.map(r => ({ roomId: r.roomId, title: r.title, playerCount: r.players.length, maxPlayers: 2, status: r.game ? "PLAYING" : "WAITING" })) } };
  }
  function roomState(r) {
    return { type: "ROOM_STATE", payload: { roomId: r.roomId, title: r.title, maxPlayers: 2, status: r.game ? "PLAYING" : "WAITING", players: r.players.map(p => ({ playerId: p.playerId, nickname: p.nickname, ready: p.ready })) } };
  }
  function chatFrom(p, text) {
    return { type: "CHAT_MESSAGE", payload: { playerId: p.playerId, nickname: p.nickname, message: text } };
  }

  function handle(msg) {
    const { type, requestId: rid, payload: p } = msg;
    if (type !== "JOIN" && !me) return error(rid, "NOT_JOINED", "닉네임을 먼저 등록하세요.");
    const r = myRoom();
    switch (type) {
      case "JOIN":
        if (p.nickname === BOT.nickname) return error(rid, "NICKNAME_TAKEN", "이미 사용 중인 닉네임입니다.");
        me = { playerId: "player-" + (Math.floor(Math.random() * 90) + 10), nickname: p.nickname };
        return ack(rid, "JOIN", { playerId: me.playerId });
      case "LIST_ROOMS":
        ack(rid, type);
        return toClient(roomList());
      case "CREATE_ROOM": {
        if (r) return error(rid, "ALREADY_IN_ROOM", "이미 방에 있습니다.");
        const room = { roomId: "room-" + (++roomSeq), title: p.title, players: [{ ...me, ready: false }], game: null };
        rooms.push(room);
        ack(rid, type, { roomId: room.roomId });
        toClient(roomState(room));
        later(() => {          // 잠시 뒤 연습 봇이 들어온다
          if (!rooms.includes(room) || room.players.length >= 2) return;
          room.players.push({ ...BOT, ready: false });
          toClient(roomState(room));
          later(() => toClient(chatFrom(BOT, "안녕하세요! 한 판 해요")), 500);
        }, 1600);
        return;
      }
      case "JOIN_ROOM": {
        const room = rooms.find(x => x.roomId === p.roomId);
        if (!room) return error(rid, "ROOM_NOT_FOUND", "방이 없습니다.");
        if (room.game) return error(rid, "GAME_IN_PROGRESS", "게임이 진행 중인 방에는 들어갈 수 없습니다.");
        if (room.players.length >= 2) return error(rid, "ROOM_FULL", "방 정원이 찼습니다.");
        room.players.push({ ...me, ready: false });
        ack(rid, type, { roomId: room.roomId });
        toClient(roomState(room));
        later(() => toClient(chatFrom(BOT, "어서 오세요! 준비되면 시작해요")), 700);
        return;
      }
      case "READY": {
        if (!r) return error(rid, "NOT_IN_ROOM", "방에 참가하세요.");
        if (r.game) return error(rid, "GAME_IN_PROGRESS", "게임 중입니다.");
        r.players.find(x => x.playerId === me.playerId).ready = p.ready;
        ack(rid, type);
        toClient(roomState(r));
        const bot = r.players.find(x => x.playerId === BOT.playerId);
        if (p.ready && bot && !bot.ready) later(() => { bot.ready = true; toClient(roomState(r)); tryStart(r); }, 900);
        tryStart(r);
        return;
      }
      case "LEAVE_ROOM": {
        if (!r) return error(rid, "NOT_IN_ROOM", "방에 참가하세요.");
        r.players = r.players.filter(x => x.playerId !== me.playerId);
        if (r.game) r.game = null;          // 남은 봇 쪽에는 PLAYER_LEFT로 종료 (시연에서는 생략)
        if (r.roomId !== "room-1") rooms = rooms.filter(x => x !== r);
        else r.players.forEach(x => { x.ready = true; });
        return ack(rid, type);
      }
      case "CHAT": {
        if (!r) return error(rid, "NOT_IN_ROOM", "방에 참가하세요.");
        const text = String(p.message).trim();
        if (!text || [...text].length > 200) return error(rid, "INVALID_MESSAGE", "채팅은 1~200자입니다.");
        ack(rid, type);
        toClient(chatFrom(me, text));
        botReplyChat(r, text);
        return;
      }
      case "PLAY_CARD":      return playCard(r, me.playerId, rid, p.cardId);
      case "SELECT_CAPTURE": return selectCapture(r, me.playerId, rid, p);
      case "DECIDE":         return decide(r, me.playerId, rid, p);
      default:               return error(rid, "UNKNOWN_TYPE", "정의되지 않은 메시지: " + type);
    }
  }

  function botReplyChat(r, text) {
    if (!r.players.some(x => x.playerId === BOT.playerId)) return;
    const replies = { "고!": "헉 고라니...", "스톱!": "다행이다", "빨리 좀 해요~": "생각 중이에요!", "아깝다!": "ㅎㅎ 운이 좋았네요", "한 판 더?": "좋아요, 준비할게요", "좋아요!": "^^" };
    const reply = replies[text];
    if (reply && Math.random() < 0.8) later(() => toClient(chatFrom(BOT, reply)), 900);
  }

  /* ---------- 게임 (간이 규칙) ---------- */
  function tryStart(r) {
    if (r.game || r.players.length < 2 || !r.players.every(x => x.ready)) return;
    const deck = [];
    for (let i = 1; i <= 48; i++) deck.push(i);
    for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
    const g = { gameId: "game-" + (++gameSeq), revision: 0, phase: "WAIT_PLAY", hands: {}, captured: {}, go: {}, lastGo: {}, table: [], deck: [], pending: null, pendingFor: null, played: 0 };
    r.players.forEach(pl => { g.hands[pl.playerId] = deck.splice(0, 10); g.captured[pl.playerId] = []; g.go[pl.playerId] = 0; g.lastGo[pl.playerId] = 0; });
    g.table = deck.splice(0, 8);
    g.deck = deck;
    g.current = r.players[0].playerId;
    r.game = g;
    toClient(roomState(r));
    toClient(state(r, "GAME_START"));
    botTurn(r);
  }

  const month = id => CARDS[id].m;
  const sameMonth = (table, card) => table.filter(t => month(t) === month(card));
  function take(g, pid, card, matched) {
    if (!matched.length) { g.table.push(card); return; }
    g.table = g.table.filter(t => !matched.includes(t));
    g.captured[pid].push(...matched, card);
  }
  function score(g, pid) {
    let gw = 0, an = 0, rb = 0, pi = 0;
    g.captured[pid].forEach(id => { const t = CARDS[id].t; if (t === "GWANG") gw++; else if (t === "ANIMAL") an++; else if (t === "RIBBON") rb++; else pi++; });
    let s = 0;
    if (gw >= 3) s += gw;
    if (an >= 5) s += an - 4;
    if (rb >= 5) s += rb - 4;
    if (pi >= 10) s += pi - 9;
    return s;
  }
  function state(r, type) {
    const g = r.game;
    g.revision++;
    const pid = me.playerId;
    return { type, payload: {
      gameId: g.gameId, revision: g.revision, phase: g.phase, currentPlayerId: g.current,
      myHand: g.hands[pid].slice(), tableCards: g.table.slice(), deckCount: g.deck.length,
      players: r.players.map(pl => ({ playerId: pl.playerId, handCount: g.hands[pl.playerId].length, capturedCards: g.captured[pl.playerId].slice(), score: score(g, pl.playerId), goCount: g.go[pl.playerId] })),
      pendingChoice: g.pending && g.pendingFor === pid ? JSON.parse(JSON.stringify(g.pending)) : null,
    } };
  }
  const sendState = r => toClient(state(r, "GAME_STATE"));
  const isMe = pid => pid === me.playerId;

  function check(r, pid, rid) {
    if (!r) { if (rid) error(rid, "NOT_IN_ROOM", "방에 참가하세요."); return null; }
    if (!r.game) { if (rid) error(rid, "GAME_NOT_STARTED", "진행 중인 게임이 없습니다."); return null; }
    if (r.game.current !== pid) { if (rid) error(rid, "NOT_YOUR_TURN", "자신의 차례가 아닙니다."); return null; }
    return r.game;
  }

  function playCard(r, pid, rid, card) {
    const g = check(r, pid, rid);
    if (!g) return;
    if (g.phase !== "WAIT_PLAY") return rid && error(rid, "INVALID_PHASE", "지금은 패를 낼 수 없습니다.");
    const idx = g.hands[pid].indexOf(card);
    if (idx < 0) return rid && error(rid, "CARD_NOT_OWNED", "손패에 없는 패입니다.");
    g.hands[pid].splice(idx, 1);
    if (rid) ack(rid, "PLAY_CARD");
    const m = sameMonth(g.table, card);
    if (m.length === 2) {
      g.phase = "WAIT_CAPTURE";
      g.played = card;
      g.pending = { gameId: g.gameId, choiceId: "choice-" + (++choiceSeq), kind: "CAPTURE", cardIds: m };
      g.pendingFor = pid;
      sendState(r);
      if (isMe(pid)) toClient({ type: "CHOICE_REQUIRED", payload: JSON.parse(JSON.stringify(g.pending)) });
      else later(() => selectCapture(r, pid, null, { choiceId: g.pending.choiceId, cardId: m[0] }), 800);
      return;
    }
    take(g, pid, card, m);
    afterPlay(r, pid);
  }

  function selectCapture(r, pid, rid, p) {
    const g = check(r, pid, rid);
    if (!g) return;
    if (!g.pending || g.pending.kind !== "CAPTURE" || g.pending.choiceId !== p.choiceId || !g.pending.cardIds.includes(p.cardId))
      return rid && error(rid, "INVALID_SELECTION", "만료된 선택이거나 후보에 없는 패입니다.");
    if (rid) ack(rid, "SELECT_CAPTURE");
    g.pending = null; g.pendingFor = null; g.phase = "WAIT_PLAY";
    take(g, pid, g.played, [p.cardId]);
    afterPlay(r, pid);
  }

  function decide(r, pid, rid, p) {
    const g = check(r, pid, rid);
    if (!g) return;
    if (!g.pending || g.pending.kind !== "GO_STOP" || g.pending.choiceId !== p.choiceId)
      return rid && error(rid, "INVALID_SELECTION", "만료된 선택입니다.");
    if (rid) ack(rid, "DECIDE");
    g.pending = null; g.pendingFor = null;
    const bot = r.players.find(x => !isMe(x.playerId));
    if (p.decision === "STOP") return endGame(r, "STOP", pid);
    g.go[pid]++;
    g.lastGo[pid] = score(g, pid);
    if (!isMe(pid)) toClient(chatFrom(bot, g.go[pid] + "고!"));
    g.phase = "WAIT_PLAY";
    nextTurn(r);
  }

  function afterPlay(r, pid) {
    const g = r.game;
    if (g.deck.length) {
      const flip = g.deck.shift();
      const m = sameMonth(g.table, flip);
      take(g, pid, flip, m.length === 2 ? [m[0]] : m);
    }
    const s = score(g, pid);
    if (s >= 3 && s > g.lastGo[pid] && g.hands[pid].length) {
      g.phase = "WAIT_GO_STOP";
      g.pending = { gameId: g.gameId, choiceId: "choice-" + (++choiceSeq), kind: "GO_STOP", options: ["GO", "STOP"] };
      g.pendingFor = pid;
      sendState(r);
      if (isMe(pid)) toClient({ type: "CHOICE_REQUIRED", payload: JSON.parse(JSON.stringify(g.pending)) });
      else later(() => decide(r, pid, null, { choiceId: g.pending.choiceId, decision: (g.go[pid] === 0 && s < 5) ? "GO" : "STOP" }), 1000);
      return;
    }
    nextTurn(r);
  }

  function nextTurn(r) {
    const g = r.game;
    if (r.players.every(pl => g.hands[pl.playerId].length === 0)) {
      const [a, b] = r.players.map(pl => pl.playerId);
      const sa = score(g, a), sb = score(g, b);
      return sa === sb ? endGame(r, "DRAW", null) : endGame(r, "STOP", sa > sb ? a : b);
    }
    g.current = r.players.find(pl => pl.playerId !== g.current).playerId;
    g.phase = "WAIT_PLAY";
    sendState(r);
    botTurn(r);
  }

  function botTurn(r) {
    const g = r.game;
    if (!g || isMe(g.current)) return;
    const pid = g.current;
    later(() => {
      if (r.game !== g || g.current !== pid || g.phase !== "WAIT_PLAY") return;
      const hand = g.hands[pid];
      const pick = hand.find(c => sameMonth(g.table, c).length > 0) || hand[0];
      playCard(r, pid, null, pick);
    }, 1100);
  }

  function endGame(r, reason, winner) {
    const g = r.game;
    g.phase = "FINISHED"; g.current = null; g.pending = null;
    sendState(r);
    toClient({ type: "GAME_OVER", payload: { gameId: g.gameId, reason, winnerId: winner,
      results: r.players.map(pl => ({ playerId: pl.playerId, score: score(g, pl.playerId), goCount: g.go[pl.playerId] })) } });
    r.game = null;
    r.players.forEach(pl => { pl.ready = false; });
    toClient(roomState(r));
  }

  function reset() {
    timers.forEach(clearTimeout);
    timers = [];
    me = null; roomSeq = 2; initRooms();
  }

  return { handle, reset };
})();

/* =====================================================================
   클라이언트: Swing 클라이언트(MainFrame / LobbyPanel / GameRoomPanel)와 같은 흐름
   ===================================================================== */
const Client = (() => {
  let reqSeq = 0;
  const reqTypes = {};
  let myId = null, myNick = "", pendingTitle = null, selectedRoom = null;
  let rooms = [];
  let room = { nicknames: {}, ready: {}, order: [], status: "WAITING", max: 2, title: "" };
  let game = null, pending = null, handledChoice = null, waiting = false;

  function send(type, payload) {
    const msg = { type, requestId: "req-" + (++reqSeq), payload: payload || {} };
    reqTypes[msg.requestId] = type;
    logMsg("송신", msg);
    setTimeout(() => Server.handle(msg), 90);
  }

  function show(name) {
    $("lobby").hidden = name !== "lobby";
    $("room").hidden = name !== "room";
  }

  function lobbyStatus(text, err) {
    const s = $("lobbyStatus");
    s.textContent = text;
    s.classList.toggle("err", !!err);
  }

  function validate(text, max, name) {
    const len = [...text].length;
    if (len < 1) return name + "을(를) 입력하세요.";
    if (len > max) return name + "은(는) " + max + "자 이하로 입력하세요.";
    if (/[\u0000-\u001f\u007f]/.test(text)) return name + "에 줄바꿈이나 제어 문자를 쓸 수 없습니다.";
    return null;
  }

  /* ---------------- 로비 ---------------- */
  function setJoined(joined) {
    $("nick").readOnly = joined;
    $("connectBtn").disabled = joined;
    $("connectBtn").textContent = joined ? "접속됨" : "접속";
    $("welcome").textContent = joined ? myNick + " 님, 환영합니다. 방을 고르거나 새로 만드세요." : "";
    $("refreshBtn").disabled = !joined;
    $("createBtn").disabled = !joined;
    if (!joined) { rooms = []; renderRooms(); }
    updateJoinBtn();
  }

  function renderRooms() {
    const tb = $("roomRows");
    tb.textContent = "";
    rooms.forEach(r => {
      const tr = document.createElement("tr");
      const playing = r.status === "PLAYING";
      const joinable = !playing && r.playerCount < r.maxPlayers;
      if (!joinable) tr.classList.add("off");
      if (r.roomId === selectedRoom) tr.classList.add("sel");
      const td1 = document.createElement("td"); td1.textContent = r.title;
      const td2 = document.createElement("td"); td2.className = "c"; td2.textContent = r.playerCount + " / " + r.maxPlayers;
      const td3 = document.createElement("td"); td3.className = "c";
      const st = document.createElement("span"); st.className = "st " + (playing ? "play" : "wait"); st.textContent = playing ? "게임 중" : "대기 중";
      td3.appendChild(st);
      tr.append(td1, td2, td3);
      tr.addEventListener("click", () => { selectedRoom = r.roomId; renderRooms(); });
      tr.addEventListener("dblclick", () => { selectedRoom = r.roomId; joinSelected(); });
      tb.appendChild(tr);
    });
    $("roomEmpty").hidden = rooms.length > 0;
    $("roomEmpty").textContent = myId ? "열린 방이 없습니다. 방을 만들어 보세요." : "접속하면 방 목록이 보입니다.";
    updateJoinBtn();
  }

  function updateJoinBtn() {
    const r = rooms.find(x => x.roomId === selectedRoom);
    $("joinBtn").disabled = !(myId && r && r.status !== "PLAYING" && r.playerCount < r.maxPlayers);
  }

  function joinSelected() {
    if ($("joinBtn").disabled) return;
    pendingTitle = null;
    send("JOIN_ROOM", { roomId: selectedRoom });
  }

  /* ---------------- 게임 방 ---------------- */
  function enterRoom(title) {
    room = { nicknames: {}, ready: {}, order: [], status: "WAITING", max: 2, title: title || "게임 방" };
    game = null; pending = null; handledChoice = null; waiting = false;
    $("roomTitleText").textContent = room.title;
    $("chatLog").textContent = "";
    sys("방에 입장했습니다.");
    $("waitView").hidden = false;
    $("gameView").hidden = true;
    show("room");
  }

  function sys(text) {
    const d = document.createElement("div");
    d.className = "sys";
    d.textContent = "· " + text;
    appendChat(d);
  }

  function appendChat(node) {
    const log = $("chatLog");
    log.appendChild(node);
    log.scrollTop = log.scrollHeight;
  }

  function addChat(p) {
    const mine = p.playerId === myId;
    const d = document.createElement("div");
    if (mine) d.className = "me";
    const n = document.createElement("span");
    n.className = "nm";
    n.textContent = p.nickname + (mine ? " (나)" : "");
    d.appendChild(n);
    d.appendChild(document.createTextNode(p.message));   // 일반 텍스트로만 표시
    appendChat(d);
  }

  const name = id => room.nicknames[id] || id;

  function setRoomState(p) {
    const before = Object.assign({}, room.nicknames);
    const prevStatus = room.status;
    room.title = p.title; room.max = p.maxPlayers; room.status = p.status;
    room.nicknames = {}; room.ready = {}; room.order = [];
    p.players.forEach(pl => { room.nicknames[pl.playerId] = pl.nickname; room.ready[pl.playerId] = pl.ready; room.order.push(pl.playerId); });
    if (Object.keys(before).length) {
      room.order.forEach(id => { if (!before[id]) sys(room.nicknames[id] + " 님이 입장했습니다."); });
      Object.keys(before).forEach(id => { if (!room.nicknames[id]) sys(before[id] + " 님이 나갔습니다."); });
    }
    $("roomTitleText").textContent = room.title;
    const playing = room.status === "PLAYING";
    $("roomPill").textContent = playing ? "게임 중" : "대기 중 · " + room.order.length + "/" + room.max;
    if (!playing) {
      if (prevStatus === "PLAYING") game = null;
      pending = null;
      $("waitView").hidden = false;
      $("gameView").hidden = true;
    }
    renderWaiting();
    if (game) renderGame();
  }

  function renderWaiting() {
    const seats = $("seats");
    seats.textContent = "";
    for (let i = 0; i < room.max; i++) {
      const id = room.order[i];
      const s = document.createElement("div");
      const n = document.createElement("div"); n.className = "n";
      const st = document.createElement("div"); st.className = "s";
      if (id) {
        const ready = room.ready[id];
        s.className = "seat" + (ready ? " ready" : "");
        n.textContent = room.nicknames[id] + (id === myId ? " (나)" : "");
        st.textContent = ready ? "준비 완료" : "준비 전";
      } else {
        s.className = "seat empty";
        n.textContent = "빈 자리";
        st.textContent = "참가자를 기다리는 중";
      }
      s.append(n, st);
      seats.appendChild(s);
    }
    const meReady = !!room.ready[myId];
    const rb = $("readyBtn");
    rb.textContent = meReady ? "준비 취소" : "준비";
    rb.classList.toggle("primary", !meReady);
    $("waitHint").textContent = room.order.length < room.max ? "빈 자리가 있습니다. 상대가 들어오면 함께 준비하세요." : "모두 준비하면 게임이 자동으로 시작됩니다.";
  }

  function setGameState(p, start) {
    if (game && !start && p.gameId === game.gameId && p.revision < game.revision) return;
    if (start) { sys("게임이 시작되었습니다!"); handledChoice = null; }
    game = p;
    waiting = false;
    pending = p.pendingChoice || null;
    $("waitView").hidden = true;
    $("gameView").hidden = false;
    renderGame();
  }

  function cardImg(id, w) {
    const img = document.createElement("img");
    if (id === -1) { img.src = BACK; img.alt = "카드 뒷면"; }
    else { img.src = CARDS[id].img; img.alt = cardName(id); img.title = cardName(id) + " (cardId " + id + ")"; }
    if (w) img.style.width = w + "px";
    return img;
  }

  function cardBtn(id, opts) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "cardbtn";
    b.appendChild(cardImg(id));
    b.setAttribute("aria-label", cardName(id));
    if (opts.play) b.classList.add("play");
    if (opts.cand) b.classList.add("cand");
    if (opts.dim) b.classList.add("dim");
    b.disabled = !(opts.play || opts.cand);
    if (opts.onClick) b.addEventListener("click", () => opts.onClick(id));
    return b;
  }

  function renderPlayer(areaId, pl, isMe, current) {
    const area = $(areaId);
    const q = k => area.querySelector('[data-k="' + k + '"]');
    q("name").textContent = name(pl.playerId) + (isMe ? " (나)" : "");
    q("info").textContent = "손패 " + pl.handCount + "장 · 점수 " + pl.score + "점 · " + pl.goCount + "고";
    q("badge").hidden = pl.playerId !== current;
    if (!isMe) {
      const backs = q("backs");
      backs.textContent = "";
      for (let i = 0; i < pl.handCount; i++) backs.appendChild(cardImg(-1));
    }
    const groups = q("groups");
    groups.textContent = "";
    const by = { GWANG: [], ANIMAL: [], RIBBON: [], PI: [] };
    pl.capturedCards.forEach(id => { const t = CARDS[id].t === "BONUS" ? "PI" : CARDS[id].t; by[t].push(id); });
    GROUPS.forEach(t => {
      const g = document.createElement("div"); g.className = "group";
      const l = document.createElement("span"); l.className = "gl"; l.textContent = TYPE_NAME[t] + " " + by[t].length;
      const s = document.createElement("div"); s.className = "stack";
      by[t].forEach(id => s.appendChild(cardImg(id)));
      g.append(l, s);
      groups.appendChild(g);
    });
  }

  function renderGame() {
    if (!game) return;
    const phase = game.phase, current = game.currentPlayerId;
    const myTurn = current === myId;
    game.players.forEach(pl => renderPlayer(pl.playerId === myId ? "myArea" : "oppArea", pl, pl.playerId === myId, current));

    const deck = game.deckCount;
    const pile = $("deckPile");
    pile.textContent = "";
    for (let i = 0; i < Math.min(deck, 5); i++) pile.appendChild(cardImg(-1));
    $("deckCnt").textContent = "덱 " + deck + "장";

    const kind = pending ? pending.kind : null;
    const capture = kind === "CAPTURE" && !waiting;
    const goStop = kind === "GO_STOP" && !waiting;
    const canPlay = myTurn && phase === "WAIT_PLAY" && !pending && !waiting;

    const tbl = $("tableCards");
    tbl.textContent = "";
    game.tableCards.forEach(id => {
      const cand = capture && pending.cardIds.includes(id);
      tbl.appendChild(cardBtn(id, { cand, dim: capture && !cand, onClick: onTableClick }));
    });
    const hand = $("hand");
    hand.textContent = "";
    game.myHand.forEach(id => hand.appendChild(cardBtn(id, { play: canPlay, onClick: onHandClick })));

    $("goBtn").hidden = !goStop;
    $("stopBtn").hidden = !goStop;
    if (goStop) {
      const mine = game.players.find(pl => pl.playerId === myId);
      $("goBtn").textContent = (mine.goCount + 1) + "고";
    }

    let text;
    if (phase === "FINISHED") text = "게임이 끝났습니다.";
    else if (waiting) text = "서버 응답을 기다리는 중...";
    else if (capture) text = "먹을 바닥패를 고르세요.";
    else if (goStop) text = "고 또는 스톱을 선택하세요.";
    else if (canPlay) text = "내 차례입니다. 낼 패를 고르세요.";
    else if (myTurn) text = "내 차례 진행 중...";
    else text = (current ? name(current) : "상대") + " 님의 차례입니다.";
    const tl = $("turnLabel");
    tl.textContent = text;
    tl.classList.toggle("mine", canPlay || capture || goStop);
  }

  function onHandClick(id) {
    if (waiting) return;
    waiting = true;
    send("PLAY_CARD", { cardId: id });
    renderGame();
  }
  function onTableClick(id) {
    if (!pending || waiting) return;
    handledChoice = pending.choiceId;
    waiting = true;
    send("SELECT_CAPTURE", { choiceId: pending.choiceId, cardId: id });
    renderGame();
  }
  function onDecide(decision) {
    if (!pending || waiting) return;
    handledChoice = pending.choiceId;
    waiting = true;
    send("DECIDE", { choiceId: pending.choiceId, decision });
    renderGame();
  }

  function onGameOver(p) {
    pending = null;
    renderGame();
    let head;
    if (!p.winnerId) head = p.reason === "DRAW" ? "나가리(무승부)입니다." : p.reason === "PLAYER_LEFT" ? "상대가 나가서 게임이 취소되었습니다." : "무승부입니다.";
    else head = p.winnerId === myId ? "승리했습니다!" : name(p.winnerId) + " 님이 이겼습니다.";
    const lines = p.results.map(r => name(r.playerId) + (r.playerId === myId ? " (나)" : "") + "  " + r.score + "점, " + r.goCount + "고");
    sys("게임 종료 — " + head);
    modal("게임 결과", head + "\n\n" + lines.join("\n"), [{ label: "확인", primary: true }]);
  }

  /* ---------------- 서버 메시지 분배 (MainFrame.onMessage) ---------------- */
  function onMessage(msg) {
    const p = msg.payload || {};
    const reqType = msg.requestId ? reqTypes[msg.requestId] : null;
    switch (msg.type) {
      case "ACK":
        if (p.requestType === "JOIN") {
          myId = p.playerId;
          setJoined(true);
          lobbyStatus("접속했습니다. (" + myId + ")");
          send("LIST_ROOMS");
        } else if (p.requestType === "CREATE_ROOM" || p.requestType === "JOIN_ROOM") {
          const r = rooms.find(x => x.roomId === p.roomId);
          enterRoom(pendingTitle || (r && r.title));
        } else if (p.requestType === "LEAVE_ROOM") {
          show("lobby");
          lobbyStatus("방에서 나왔습니다.");
          send("LIST_ROOMS");
        } else if (p.requestType === "READY") {
          $("readyBtn").disabled = false;
        }
        break;
      case "ERROR":
        if (reqType === "JOIN") { myId = null; setJoined(false); lobbyStatus(p.message, true); }
        else if (["LIST_ROOMS", "CREATE_ROOM", "JOIN_ROOM"].includes(reqType)) { lobbyStatus(p.message, true); send("LIST_ROOMS"); }
        else { waiting = false; if (reqType === "READY") $("readyBtn").disabled = false; sys("요청 실패: " + p.message); renderGame(); }
        break;
      case "ROOM_LIST":       rooms = p.rooms; if (!rooms.some(r => r.roomId === selectedRoom)) selectedRoom = null; renderRooms(); break;
      case "ROOM_STATE":      setRoomState(p); break;
      case "CHAT_MESSAGE":    addChat(p); break;
      case "GAME_START":      setGameState(p, true); break;
      case "GAME_STATE":      setGameState(p, false); break;
      case "CHOICE_REQUIRED": if (p.choiceId !== handledChoice) { pending = p; waiting = false; renderGame(); } break;
      case "GAME_OVER":       onGameOver(p); break;
    }
    if (msg.requestId) delete reqTypes[msg.requestId];
  }

  /* ---------------- 이벤트 연결 ---------------- */
  function bind() {
    $("connectForm").addEventListener("submit", e => {
      e.preventDefault();
      if (myId) return;
      const nick = $("nick").value.trim();
      const err = validate(nick, 12, "닉네임");
      if (err) return lobbyStatus(err, true);
      myNick = nick;
      lobbyStatus("서버에 접속하는 중...");
      send("JOIN", { nickname: nick });
    });
    $("refreshBtn").addEventListener("click", () => send("LIST_ROOMS"));
    $("createBtn").addEventListener("click", () => {
      $("createForm").hidden = false;
      $("roomTitle").value = myNick + "님의 방";
      $("roomTitle").focus();
      $("roomTitle").select();
    });
    $("createCancel").addEventListener("click", () => { $("createForm").hidden = true; });
    $("createForm").addEventListener("submit", e => {
      e.preventDefault();
      const title = $("roomTitle").value.trim();
      const err = validate(title, 30, "방 제목");
      if (err) return lobbyStatus(err, true);
      $("createForm").hidden = true;
      pendingTitle = title;
      send("CREATE_ROOM", { title });
    });
    $("joinBtn").addEventListener("click", joinSelected);

    $("readyBtn").addEventListener("click", () => {
      $("readyBtn").disabled = true;
      send("READY", { ready: !room.ready[myId] });
    });
    $("leaveBtn").addEventListener("click", () => {
      if (room.status === "PLAYING") {
        modal("방 나가기", "게임 중에 나가면 이번 판이 종료됩니다. 나갈까요?",
          [{ label: "계속하기" }, { label: "나가기", primary: true, onClick: () => send("LEAVE_ROOM") }]);
      } else send("LEAVE_ROOM");
    });
    $("goBtn").addEventListener("click", () => onDecide("GO"));
    $("stopBtn").addEventListener("click", () => onDecide("STOP"));

    QUICK.forEach(q => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "btn"; b.textContent = q;
      b.addEventListener("click", () => send("CHAT", { message: q }));
      $("quick").appendChild(b);
    });
    $("chatForm").addEventListener("submit", e => {
      e.preventDefault();
      const text = $("chatInput").value.trim();
      if (!text) return;
      if ([...text].length > 200) return sys("채팅은 200자까지 보낼 수 있습니다.");
      send("CHAT", { message: text });
      $("chatInput").value = "";
    });
  }

  function reset() {
    reqSeq = 0; myId = null; myNick = ""; pendingTitle = null; selectedRoom = null; rooms = [];
    game = null; pending = null; waiting = false;
    $("nick").value = "";
    $("createForm").hidden = true;
    setJoined(false);
    lobbyStatus("닉네임을 입력하고 접속하세요.");
    $("modal").hidden = true;
    show("lobby");
  }

  return { onMessage, bind, reset };
})();

/* ===== 공통 모달 (alert/confirm 대신) ===== */
function modal(title, body, buttons) {
  $("modalTitle").textContent = title;
  $("modalBody").textContent = body;
  const row = $("modalRow");
  row.textContent = "";
  buttons.forEach(b => {
    const el = document.createElement("button");
    el.type = "button";
    el.className = "btn" + (b.primary ? " primary" : "");
    el.textContent = b.label;
    el.addEventListener("click", () => { $("modal").hidden = true; if (b.onClick) b.onClick(); });
    row.appendChild(el);
  });
  $("modal").hidden = false;
  row.lastChild.focus();
}

$("logToggle").addEventListener("click", () => {
  const panel = $("logPanel");
  panel.hidden = !panel.hidden;
  $("logToggle").textContent = panel.hidden ? "통신 로그 보기" : "통신 로그 닫기";
});
$("logClear").addEventListener("click", () => { $("logBody").textContent = ""; });
$("resetBtn").addEventListener("click", () => { Server.reset(); Client.reset(); $("logBody").textContent = ""; });

Client.bind();
</script>
